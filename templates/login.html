{% extends "base.html" %}

{% block title %}Log In - School Lost & Found{% endblock %}

{% block content %}
<div class="card form-card">
    <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-icon" style="margin: 0 auto 14px; width: 48px; height: 48px; font-size: 1.5rem;">🔐</div>
        <h2 style="font-size: 1.6rem; margin-bottom: 6px;">Sign In to School Portal</h2>
        <p style="font-size: 0.88rem; color: var(--text-muted);">Access your reports, track claims, or manage school inventory.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" data-validate="true">
        <div class="form-group">
            <label for="email">School Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@school.local" value="{{ email or '' }}" required autofocus>
        </div>

        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label for="password" style="margin-bottom: 0;">Password</label>
                <button type="button" class="toggle-password-btn" data-target="password" style="background: none; border: none; color: var(--accent-cyan); font-size: 0.78rem; cursor: pointer;">👁 Show</button>
            </div>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Log In to Account</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account yet? <a href="{{ url_for('register') }}" style="font-weight: 600;">Create Student Account &rarr;</a>
    </div>
</div>
{% endblock %}
